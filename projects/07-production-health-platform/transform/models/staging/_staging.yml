version: 2

models:
  - name: stg_submissions
    description: Typed, lightly cleaned monthly community-health form submissions.
    columns:
      - name: submission_id
        description: Unique submission identifier from the source.
        tests: [not_null, unique]
      - name: site_id
        tests: [not_null]
      - name: period
        description: Reporting month, YYYY-MM.
        tests: [not_null]
      - name: households_visited
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100000
      - name: stockout_days
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 31
