apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: health-platform
spec:
  replicas: 2
  selector:
    matchLabels: {app: ingestion}
  template:
    metadata:
      labels: {app: ingestion}
    spec:
      containers:
        - name: ingestion
          image: ghcr.io/your-username/health-platform-ingestion:latest
          command: ["python", "couchdb_changes.py"]
          envFrom:
            - configMapRef: {name: platform-config}
          env:
            - name: WAREHOUSE_DSN
              valueFrom: {secretKeyRef: {name: platform-secrets, key: WAREHOUSE_DSN}}
            - name: COUCHDB_URL
              valueFrom: {secretKeyRef: {name: platform-secrets, key: COUCHDB_URL}}
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits:   {cpu: "500m", memory: "256Mi"}
